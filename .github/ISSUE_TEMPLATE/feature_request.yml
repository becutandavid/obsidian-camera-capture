name: Feature request
description: Suggest an idea or improvement.
labels: [enhancement]
body:
    - type: textarea
      id: problem
      attributes:
          label: What would you like to do?
          description: Describe the situation and what's missing today.
      validations:
          required: true
    - type: textarea
      id: solution
      attributes:
          label: How could it work?
          description: Optional. Any idea of how the plugin could support this.
